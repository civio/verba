name: Tests

on:
  push:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:9.0.4
        env:
          discovery.type: single-node
          xpack.security.enabled: false
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9201:9200
        options: >-
          --health-cmd "curl -s localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"
          --health-interval 5s
          --health-retries 30

    env:
      API_URL: http://localhost:8899/

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run test:web:build

      - name: Load the fixture into Elasticsearch
        run: test/seed.sh http://localhost:9201

      - name: Start the API
        run: |
          ELASTIC_API_URL=http://localhost:9201 PORT=8899 nohup node api/src/index.js > api.log 2>&1 &
          for i in $(seq 30); do curl -sf $API_URL > /dev/null && exit 0; sleep 1; done
          cat api.log && exit 1

      - run: npx playwright install --with-deps chromium
      - run: npm run test:web
      - run: npm run test:api

      - if: failure()
        run: cat api.log
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
